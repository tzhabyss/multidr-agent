[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-deepresearch"
version = "0.1.0"
description = "Evidence-driven multi-round Deep Research agent built with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "openai>=2.0,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "pypdf>=5,<7",
    "pyyaml>=6,<7",
    "redis>=5,<7",
    "mcp>=1.17,<2",
    "numpy>=1.24,<3",
    "prompt_toolkit>=3.0,<4",
    "rich>=13,<15",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
memory = ["sentence-transformers>=3,<6"]
search = ["ddgs>=9,<10"]
documents = ["pypdf>=5,<6", "python-docx>=1.1,<2"]
browser = ["scrapling[fetchers]>=0.4.11,<0.5"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1"]

[project.scripts]
deepresearch = "deepresearch.cli:main"
deepresearch-eval = "evaluation.cli:main"

[tool.setuptools.packages.find]
include = ["deepresearch*", "evaluation*"]

[tool.setuptools.package-data]
"deepresearch.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
