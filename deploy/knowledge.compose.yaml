# Single application database: Milvus. etcd/MinIO are Milvus infrastructure.
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
    - ETCD_AUTO_COMPACTION_MODE=revision
    - ETCD_AUTO_COMPACTION_RETENTION=1000
    - ETCD_QUOTA_BACKEND_BYTES=4294967296
    - ETCD_SNAPSHOT_COUNT=50000
    volumes:
    - rag_etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    healthcheck:
      test:
      - CMD
      - etcdctl
      - endpoint
      - health
      interval: 30s
      timeout: 20s
      retries: 3
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
    - rag_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
  standalone:
    image: milvusdb/milvus:v2.5.17
    command:
    - milvus
    - run
    - standalone
    security_opt:
    - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
    - rag_standalone:/var/lib/milvus
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9091/healthz
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
    - etcd
    - minio
    ports:
    - 127.0.0.1:19530:19530
    - 127.0.0.1:9091:9091
name: deepresearch-rag
volumes:
  rag_etcd: {}
  rag_minio: {}
  rag_standalone: {}
